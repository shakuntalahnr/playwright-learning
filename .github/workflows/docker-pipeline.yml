name: Build and Push to Docker Hub

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Get your code from GitHub
    - name: Checkout code
      uses: actions/checkout@v3
    
    # Step 2: Setup Docker build tools
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    # Step 3: Login to Docker Hub using secrets
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    # Step 4: Build and Push Docker image
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/playwright-learning:latest
          ${{ secrets.DOCKER_USERNAME }}/playwright-learning:${{ github.sha }}
    
    # Step 5: Run tests inside the Docker image
    - name: Run Tests in Docker
      run: |
        docker run --rm \
          ${{ secrets.DOCKER_USERNAME }}/playwright-learning:latest
    
    # Step 6: Upload test reports
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: pytest-reports
        path: reports/
        retention-days: 30
